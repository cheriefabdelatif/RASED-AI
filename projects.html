        alert('يجب تسجيل الدخول أولاً');

      loadProjects(currentUser.id);

    async function loadProjects(userId) {
      try {
        const response = await fetch(`/projects/${userId}`);
        const data = await response.json();

        if (data.success) {
          displayProjects(data.projects);
        } else {
          console.error('فشل في تحميل المشاريع:', data.message);
          displayProjects([]);

      if (projects.length === 0) {

      }

      noProjectsMessage.classList.add('hidden');

      container.innerHTML = projects.map(project => `
        <div class="project-card bg-white rounded-lg shadow-md p-6 hover:shadow-lg transition" onclick="viewProject('${project.id}')">
          <div class="flex justify-between items-start mb-4">

            <div class="flex items-center">
              <i class="fas fa-industry text-gray-400 w-4"></i>
              <span class="mr-2">${project.activity_type || 'غير محدد'}</span>
            </div>
            <div class="flex items-center">
              <i class="fas fa-calendar text-gray-400 w-4"></i>
              <span class="mr-2">${project.establishment_date ? new Date(project.establishment_date).toLocaleDateString('ar-DZ') : 'غير محدد'}</span>
            </div>
            <div class="flex items-center">
              <i class="fas fa-chart-line text-gray-400 w-4"></i>
              <span class="mr-2">${project.current_stage || 'غير محدد'}</span>
            </div>
          </div>

          <!-- المعلومات المالية -->
          <div class="mt-4 pt-4 border-t">
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div>
                <span class="text-gray-500">الإيرادات الشهرية:</span>
                <div class="font-semibold text-green-600">${formatNumber(project.monthly_revenue || 0)} دج</div>
              </div>
              <div>
                <span class="text-gray-500">صافي الربح:</span>
                <div class="font-semibold ${(project.net_profit || 0) >= 0 ? 'text-green-600' : 'text-red-600'}">
                  ${formatNumber(project.net_profit || 0)} دج
                </div>
              </div>
            </div>
          </div>

          <!-- وصف مختصر -->
          ${project.description ? `
            <div class="mt-3 pt-3 border-t">
              <p class="text-gray-600 text-xs line-clamp-2">${project.description}</p>
            </div>
          ` : ''}

          <!-- معلومات إضافية -->

            </div>
          </div>
        </div>
      `).join('');
    }

    function formatNumber(num) {
      return new Intl.NumberFormat('ar-DZ').format(num);
    }

    function viewProject(projectId) {
      window.location.href = `project-details.html?id=${projectId}`;
    }

    function editProject(projectId) {
      window.location.href = `project-details.html?id=${projectId}`;
    }

    function logout() {
      localStorage.removeItem('isLoggedIn');
      localStorage.removeItem('currentUser');
      alert('تم تسجيل الخروج');
      window.location.href = 'index.html';
    }
  </script>
